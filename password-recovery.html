
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080B16">
  <title>Password Recovery | Ahmad WebWorks</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .recovery-card {
      width: min(440px, 92%);
      margin: 120px auto;
      padding: 28px;
      background: #111827;
      border: 1px solid #30384c;
      border-radius: 18px;
    }
    .recovery-form {
      display: grid;
      gap: 15px;
    }
    .recovery-form label {
      display: grid;
      gap: 8px;
    }
    .recovery-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #30384c;
      border-radius: 9px;
      background: #0b1020;
      color: white;
    }
    .message {
      min-height: 28px;
      color: #b7c8ff;
      overflow-wrap: anywhere;
    }
    .back-link { color: #b7c8ff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="brand">
      <span class="brand-mark">AW</span>
      <span class="brand-word">AHMAD <em>WEBWORKS</em></span>
    </a>
  </nav>
</header>

<main class="recovery-card">
  <h1>Password <span class="grad-text">Recovery.</span></h1>
  <p id="description">Enter your registered team email address.</p>

  <form id="requestForm" class="recovery-form">
    <label>Email Address
      <input id="email" type="email" required autocomplete="email">
    </label>
    <button class="btn btn-primary" type="submit">Send Recovery Email</button>
  </form>

  <form id="updateForm" class="recovery-form hidden">
    <label>New Password
      <input id="password" type="password" minlength="8" required autocomplete="new-password">
    </label>
    <label>Confirm Password
      <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
    </label>
    <button class="btn btn-primary" type="submit">Update Password</button>
  </form>

  <p id="message" class="message" role="status"></p>
  <a class="back-link" href="portal.html">Back to Team Portal</a>
</main>

<script type="module">
import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://vxdzyfbxcorxqysvlzgn.supabase.co",
  "sb_publishable_egeeneg2jGd6y2yotB_Bdw_FR2XMVJB"
);

const recoveryURL =
  "https://ahmadwebworks.github.io/ahmad-webworks/password-recovery.html";

const portalURL =
  "https://ahmadwebworks.github.io/ahmad-webworks/portal.html";

const $ = id => document.getElementById(id);
let recoveryReady = false;
let submitting = false;

function message(text) {
  $("message").textContent = text;
}

function showRecoveryForm() {
  recoveryReady = true;
  $("requestForm").classList.add("hidden");
  $("updateForm").classList.remove("hidden");
  $("description").textContent =
    "Your recovery link is verified. Choose a new password.";
  message("Enter and confirm your new password.");
}

const { data: authListener } = supabase.auth.onAuthStateChange(
  async (event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
      showRecoveryForm();
    }
  }
);

$("requestForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (submitting) return;
  submitting = true;

  const button = event.submitter;
  button.disabled = true;
  message("Sending recovery email...");

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(
      $("email").value.trim(),
      { redirectTo: recoveryURL }
    );

    if (error) throw error;

    message(
      "If an account exists for this address, a recovery email has been sent. Check your inbox and spam folder."
    );
  } catch (error) {
    message(error.message);
  } finally {
    submitting = false;
    button.disabled = false;
  }
});

$("updateForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!recoveryReady || submitting) return;

  const password = $("password").value;
  const confirmation = $("confirmPassword").value;

  if (password.length < 8) {
    message("Password must contain at least 8 characters.");
    return;
  }

  if (password !== confirmation) {
    message("Passwords do not match.");
    return;
  }

  submitting = true;
  const button = event.submitter;
  button.disabled = true;
  message("Updating your password...");

  try {
    const { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();

    if (sessionError) throw sessionError;
    if (!sessionData.session) {
      throw new Error("Recovery session expired. Request a new link.");
    }

    const { error } = await supabase.auth.updateUser({ password });
    if (error) throw error;

    recoveryReady = false;
    $("updateForm").classList.add("hidden");
    message("Password updated successfully. Returning to Team Portal...");

    await supabase.auth.signOut();

    setTimeout(() => {
      location.href = portalURL;
    }, 2200);
  } catch (error) {
    message(error.message);
  } finally {
    submitting = false;
    button.disabled = false;
  }
});

const hash = new URLSearchParams(location.hash.slice(1));
const params = new URLSearchParams(location.search);

if (hash.has("error")) {
  message(
    hash.get("error_description") ||
    "This recovery link is invalid or expired. Request another one."
  );
} else if (
  params.has("code") ||
  hash.has("access_token")
) {
  message("Verifying your recovery link...");
}
</script>
</body>
</html>
