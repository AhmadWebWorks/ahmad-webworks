name: Website quality checks

on:
  push:
    branches:
      - main
      - site-redesign/2026-11-22
      - premium-live-site-refinement-2026-11-24
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check links, assets, responsive layouts and navigation
        run: node tests/site-check.cjs
      - name: Upload mobile homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-homepage-visuals
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3

  database-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Replay every migration on a clean local database
        run: supabase db reset --local
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
